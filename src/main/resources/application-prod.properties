spring.application.name=axiom

frontend.url=${FRONTEND_URL}

spring.datasource.url=${SPRING_DATASOURCE_URL}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE}


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.jpa.hibernate.ddl-auto=validate

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGIN}

# Refresh token cookie
auth.refresh-cookie.name=${AUTH_REFRESH_COOKIE_NAME}
auth.refresh-cookie.path=${AUTH_REFRESH_COOKIE_PATH}
auth.refresh-cookie.max-age-seconds=${AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS}
auth.refresh-cookie.http-only=${AUTH_REFRESH_COOKIE_HTTP_ONLY}
auth.refresh-cookie.secure=${AUTH_REFRESH_COOKIE_SECURE}
auth.refresh-cookie.same-site=${AUTH_REFRESH_COOKIE_SAME_SITE}

server.port=${PORT:8080}
server.address=0.0.0.0


spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525

spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_KEY}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${BREVO_SENDER_EMAIL}
app.mail.from-name=TaskFlow